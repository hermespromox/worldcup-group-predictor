[project]
name = "worldcup-group-predictor"
version = "0.1.0"
description = "Transparent World Cup group-stage predictor using historical international results."
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "PyYAML>=6.0"]

[project.scripts]
worldcup-predict = "worldcup_predictor.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
